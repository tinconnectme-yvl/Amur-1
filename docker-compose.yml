version: '3.8'

services:
  amur-hydroscan:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amur-hydroscan-situational-center
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
